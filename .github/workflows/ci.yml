name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [src/Concepts, src/Practice]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
